name: ScoreBig (TicketNetwork)
description: 'ScoreBig is an online event-ticket resale marketplace owned by TicketNetwork,
  selling tickets to live sports, concert, and theater events with an emphasis on transparent,
  all-in pricing (no extra fees or hidden costs) and a money-back guarantee. Its parent,
  TicketNetwork, operates the Mercury Web Services API and Mercury Retail integration
  platform, an API-driven, real-time ticket-inventory feed offered to partners under
  contract. ScoreBig itself is a consumer storefront and does not publish a public developer
  API; Mercury is partner-gated behind a sales/onboarding contact form with a sandbox
  provided to approved integrators. This profile was surfaced as a portfolio company of
  Bain Capital Ventures and enriched by the API Evangelist pipeline.'
